[project]
name = "internacia-api"
version = "0.1.0"
description = "Self-hosted REST API for internacia-db, built on the internacia Python SDK"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dateno", email = "ibegtin@dateno.io" }]
dependencies = [
    "internacia>=0.3,<0.4",
    "fastapi>=0.150",
    # FastAPI's own floor still allows starlette releases with known advisories.
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.40",
    "pydantic>=2.9",
    "pydantic-settings>=2.14.2",
    # Loaded by pydantic-settings for `.env`; floor is the first release without known advisories.
    "python-dotenv>=1.2.2",
]

[project.urls]
Repository = "https://github.com/datenoio/internacia-api"
Issues = "https://github.com/datenoio/internacia-api/issues"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "httpx>=0.28",
    "ruff>=0.17,<0.18",
]

[tool.uv]
package = false

# TEMPORARY: internacia 0.3.0 is not on PyPI yet. Until it is, resolve the SDK from the
# head of datenoio/internacia-python#3 (the full 0.3.0 stack). Delete this table and run
# `uv lock --upgrade-package internacia` once 0.3.0 is published.
[tool.uv.sources]
internacia = { git = "https://github.com/datenoio/internacia-python", branch = "cursor/py-0-3-packaging-release-61fa" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
