name: Tag release

# Tags vX.Y.Z when main carries a version from pyproject.toml that has a dated CHANGELOG entry
# and no tag yet (data-bump PRs and manual releases alike). docker.yml then publishes the image.
# The tag is pushed with the internacia-bot App token because tags pushed with GITHUB_TOKEN do
# not start other workflows.

on:
  push:
    branches: [main]
    paths: [pyproject.toml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find an untagged released version
        id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if ! grep -Eq "^## \[${version//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "v$version has no dated CHANGELOG entry; nothing to tag"
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already tagged"
            exit 0
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check bot app secrets
        if: steps.version.outputs.version
        env:
          CLIENT_ID: ${{ secrets.INTERNACIA_BOT_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.INTERNACIA_BOT_PRIVATE_KEY }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "::error::INTERNACIA_BOT_CLIENT_ID / INTERNACIA_BOT_PRIVATE_KEY are not set; tag v${{ steps.version.outputs.version }} by hand."
            exit 1
          fi

      - name: Mint bot app token
        id: app-token
        if: steps.version.outputs.version
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.INTERNACIA_BOT_CLIENT_ID }}
          private-key: ${{ secrets.INTERNACIA_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Push the tag
        if: steps.version.outputs.version
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "internacia-bot[bot]"
          git config user.email "internacia-bot[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "v$VERSION"
          echo "Tagged v$VERSION; docker.yml publishes the image." >> "$GITHUB_STEP_SUMMARY"
